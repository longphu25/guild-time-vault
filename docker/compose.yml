services:
  sui-dev:
    build: .
    stdin_open: true
    tty: true
    ports:
      # Exposes local Sui node RPC — for local development only (host:9009 → container:9000)
      - "9009:9000"
    volumes:
      - sui-config:/root/.sui
      - ../:/workspace/builder-scaffold

volumes:
  sui-config:
